{% extends 'admin.html' %}

{% block content %}
<style>
    .tm-flex-container {
        display: flex;
        align-items: center;
    }
    
    .tm-flex-container label {
        flex: 0 0 150px; /* Adjust this value to control the width of the label */
        margin-right: 10px; /* Adjust this value to control the spacing between the label and input */
    }
    
    .tm-flex-container input,
    .tm-flex-container textarea,
    .tm-flex-container select {
        flex: 1;
    }

    .tm-form-control option {
        color: black;  /* Mengubah warna teks option menjadi hitam */
    }
</style>
{% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div id="flash-message" class="alert-container">
              {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                  <center>{{ message }}</center>
                </div>
              {% endfor %}
              <script>
                setTimeout(function() {
                    var flashMessage = document.getElementById('flash-message');
                    flashMessage.remove();
                }, 3000); // 3 detik
            </script>
            </div>
          {% endif %}
        {% endwith %}
<div class="tm-black-bg tm-contact-form-container tm-align-center">
    <form action="{{ url_for('add_wisata')}}" method="POST" id="contact-form">
      <div class="tm-form-group">
        <div class="tm-flex-container">
        <label>Nama</label>
        <input type="text" name="place_name" id="place_name" class="tm-form-control" placeholder="Nama" required="" />
        </div>
      </div>   
      <div class="tm-form-group">
        <div class="tm-flex-container">
        <label>Kategori</label>
        <select name="category" id="category" class="tm-form-control" required="">
          <option value="" disabled selected>Pilih Kategori</option>
          <option value="Taman Hiburan">Taman Hiburan</option>
          <option value="Budaya">Budaya</option>
          <option value="Cagar Alam">Cagar Alam</option>
          <option value="Bahari">Bahari</option>
          <option value="Pusat Perbelanjaan">Pusat Perbelanjaan</option>
          <option value="Ibadah">Ibadah</option>
          <!-- Tambahkan opsi lain sesuai kebutuhan -->
        </select>
        </div>
      </div>     
      <div class="tm-form-group tm-mb-30">
        <div class="tm-flex-container">
        <label>Deskripsi</label>
        <textarea rows="6" name="description" class="tm-form-control" placeholder="Deskripsi" required=""></textarea>
        </div>
      </div> 
      <div class="tm-form-group">
        <div class="tm-flex-container">
        <label>Lokasi</label>
        <input type="text" name="city" id="city" class="tm-form-control" placeholder="Lokasi" required="" />
        </div>
      </div>  
      <div class="tm-form-group">
        <div class="tm-flex-container">
        <label>Rating</label>
        <input type="text" name="rating" id="rating" class="tm-form-control" placeholder="Rating" required="" />
        </div>
      </div>
      <div class="tm-form-group">
        <div class="tm-flex-container">
        <label>Harga</label>
        <input type="text" name="price" id="price" class="tm-form-control" placeholder="Harga" required="" />
        </div>
      </div>
      <div class="tm-form-group">
        <div class="tm-flex-container">
        <label>URL Gambar</label>
        <input type="text" name="image" id="image" class="tm-form-control" placeholder="URL Gambar" required="" />
        </div>
      </div> 
      <div class="tm-form-group">
        <div class="tm-flex-container">
        <label>URL</label>
        <input type="text" name="url" id="url" class="tm-form-control" placeholder="URL" required="" />
        </div>
      </div>      
      <div>
        <button type="submit" class="tm-btn-primary tm-align-right">
          Submit
        </button>
      </div>
    </form>
  </div>
{% endblock %}
